name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  repository:
    name: Repository content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Publication manifest and documentation
        run: |
          python3 scripts/check-repository.py
          python3 scripts/check-fee-settlement-evaluation.py --schema >/tmp/fee-settlement-schema.json
      - name: Audit evidence and memory declarations
        run: |
          python3 scripts/check-audit-registry.py
          python3 scripts/check-memory-budgets.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          python3 -m unittest discover -s tools/control-panel -p 'test_*.py' -v
  workspace:
    name: Workspace (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Format
        run: cargo fmt --all --check
      - name: Default feature isolation
        run: python3 scripts/check-node-features.py
      - name: Default binaries
        run: cargo check -p siworld-node --bins --locked
      - name: Default proof selection
        run: cargo test -p siworld-node --bin siworld-node --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features --locked
  bench-plonky3:
    name: STARK benchmark tests (Plonky3)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: crates/bench-stark
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: crates/bench-stark
      - name: Format
        run: cargo fmt --all --check
      - name: Tests
        run: cargo test --release --locked -p siworld-bench-plonky3 -p siworld-bench-common
      - name: Isolated composition relation and profiler format
        run: |
          cargo test --release --locked -p siworld-bench-plonky3 --features experimental-fanin,phase-profile,security-report --lib
          cargo clippy --release --locked -p siworld-bench-plonky3 --features experimental-fanin,phase-profile,security-report --bin composition-bench -- -D warnings
      - name: D8 scalar geometry rejection tests
        run: |
          cargo test --release --locked -p siworld-bench-plonky3 --features d8-geometry --lib d8_geometry::tests
          cargo clippy --release --locked -p siworld-bench-plonky3 --features d8-geometry --lib -- -D warnings
      - name: Conditional D8 planning screen
        run: |
          cargo test --release --locked -p siworld-bench-plonky3 --features security-report --bin d8-security-screen
          cargo clippy --release --locked -p siworld-bench-plonky3 --features security-report --bin d8-security-screen -- -D warnings
          cargo run --release --locked -p siworld-bench-plonky3 --features security-report --bin d8-security-screen > /tmp/d8-screen.json
          python3 -c 'import json; r=json.load(open("/tmp/d8-screen.json")); assert len(r["layers"]) == 3; assert all(len(x["candidates"]) == 3 and all(c["screen_pass_conditional_on_shape_and_sites"] and not c["approved"] for c in x["candidates"]) for x in r["layers"])'
      - name: Bounded intra-proof parallel hiding experiment
        working-directory: .
        env:
          RAYON_NUM_THREADS: 2
          SIWORLD_COMPOSITION_HIDING_WORKERS: 2
        run: |
          python3 scripts/build-composition-intra.py
          cargo test --release --locked --manifest-path .local/composition-intra/benchmark/Cargo.toml -p siworld-bench-plonky3 --features experimental-fanin,phase-profile,security-report --lib

  prover-release:
    name: Linux proof release ISA and CPU admission
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Compile baseline admission tests
        run: |
          rustfmt --check scripts/prover-launcher.rs
          rustc scripts/prover-launcher.rs --edition=2021 --test -D warnings -C target-cpu=x86-64 -o /tmp/prover-launcher-tests
          /tmp/prover-launcher-tests
          if rustc scripts/prover-launcher.rs --edition=2021 -C target-cpu=x86-64-v3 -o /tmp/invalid-launcher > /tmp/launcher-build.log 2>&1; then
            echo "Optimized bootstrap was incorrectly accepted"
            exit 1
          fi
          python3 -c 'from pathlib import Path; assert "must use the generic x86-64 baseline" in Path("/tmp/launcher-build.log").read_text()'
      - name: Build controlled production release
        run: python3 scripts/build-prover-release.py --output .local/prover-release
      - name: Inspect actual proof worker and supported CPU admission
        run: |
          python3 scripts/check-prover-isa.py --binary .local/prover-release/libexec/siworld-node
          .local/prover-release/bin/siworld-node --check-cpu
          .local/prover-release/bin/siworld-node --help
      - name: Install CPU emulation
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-user
      - name: Reject unsupported CPU before any optimized worker starts
        run: |
          python3 - <<'PY_CPU_TEST'
          import json, os, shutil, subprocess, tempfile
          from pathlib import Path
          release = Path('.local/prover-release').resolve()
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              (root / 'bin').mkdir()
              (root / 'libexec').mkdir()
              launcher = root / 'bin/siworld-node'
              shutil.copy2(release / 'bin/siworld-node', launcher)
              sentinel = root / 'worker-started'
              worker = root / 'libexec/siworld-node'
              worker.write_text('#!/bin/sh\nprintf "%s" "$1" > "$PROVER_SENTINEL"\nexit 23\n')
              worker.chmod(0o755)
              for cpu in ('Nehalem', 'max,-xsave'):
                  result = subprocess.run(['qemu-x86_64', '-cpu', cpu, str(launcher), '--help'],
                      capture_output=True, text=True, env={**os.environ, 'PROVER_SENTINEL': str(sentinel)})
                  assert result.returncode == 78, (cpu, result.returncode, result.stderr)
                  assert 'including AVX2' in result.stderr and 'Scalar fallback is disabled' in result.stderr
                  assert not sentinel.exists(), 'Unsupported CPU executed a worker'
                  checked = subprocess.run(['qemu-x86_64', '-cpu', cpu, str(launcher), '--check-cpu'],
                      capture_output=True, text=True)
                  assert checked.returncode == 78
                  assert not json.loads(checked.stdout)['supported']
              forwarded = subprocess.run([str(launcher), 'argument-preserved'],
                  env={**os.environ, 'PROVER_SENTINEL': str(sentinel)})
              assert forwarded.returncode == 23
              assert sentinel.read_text() == 'argument-preserved'
          PY_CPU_TEST

  native-transaction:
    name: Native D8 transaction relation and codec
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Prepare isolated pinned native implementation
        run: python3 scripts/build-d8-checkpoint.py --prepare-only --output .local/native-transaction
      - name: Check CPU before executing optimized tests
        run: |
          rustc scripts/prover-launcher.rs --edition=2021 -O -D warnings -C target-cpu=x86-64 -o /tmp/native-cpu-check
          /tmp/native-cpu-check --check-cpu
      - name: Native constraint and encoding rejection tests
        env:
          RAYON_NUM_THREADS: 4
        run: |
          cargo fmt --manifest-path crates/bench-d8/Cargo.toml --all --check
          python3 - <<'PY_NATIVE_TEST'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('build_d8', 'scripts/build-d8-checkpoint.py')
          build = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(build)
          command = ['cargo', 'test', '--release', '--manifest-path', '.local/native-transaction/application/Cargo.toml', '--features', 'security-report', '--lib']
          for module, minimum in [('transaction', 8), ('codec', 7), ('encryption', 12), ('fee_settlement', 5), ('proof_codec', 14)]:
              selected = [*command, module + '::tests']
              if module == 'codec':
                  selected += ['--', '--skip', 'proof_codec::tests']
              build.run_logged(selected, Path('.local/native-transaction') / (module + '-tests.log'), nonempty_tests=True, minimum_tests=minimum)
          build.run_logged([*command[:-1], '--test', 'snapshots'], Path('.local/native-transaction/snapshot-tests.log'), nonempty_tests=True, minimum_tests=15)
          build.run_logged([*command, 'proof_codec::tests::candidate_profile_roundtrips_the_actual_transaction_air', '--', '--ignored'], Path('.local/native-transaction/candidate-codec-test.log'), nonempty_tests=True, minimum_tests=1)
          build.run_logged([*command[:-1], '--bin', 'v1-transaction-scan'], Path('.local/native-transaction/diagnostic-tests.log'), nonempty_tests=True, minimum_tests=2)
          PY_NATIVE_TEST
          cargo clippy --release --manifest-path .local/native-transaction/application/Cargo.toml --features security-report --lib --bin v1-transaction-scan -- -D warnings
          cargo build --release --manifest-path .local/native-transaction/application/Cargo.toml --features security-report --bin v1-transaction-scan
          .local/native-transaction/application/target/release/v1-transaction-scan --security-only --log-blowup 4 --queries 80 --grinding 16 --output .local/native-transaction/security-diagnostic.json
      - name: Preserve registry dependency pins
        run: |
          python3 - <<'PY_LOCK'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('build_d8', 'scripts/build-d8-checkpoint.py')
          build = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(build)
          expected = build.registry_pins(Path('crates/bench-d8/Cargo.lock').read_text())
          actual = build.registry_pins(Path('.local/native-transaction/application/Cargo.lock').read_text())
          assert expected == actual, 'Registry pins changed during native validation'
          PY_LOCK
