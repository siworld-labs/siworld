[package]
name = "siworld-aggregate-program"
description = "SP1 guest: binary aggregation of two child proofs"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"
repository = "https://github.com/siworld-labs/siworld"

[workspace]

[dependencies]
sp1-zkvm = { version = "=6.10.0", features = ["verify"] }
sha2 = "0.10.8"

# As in the official SP1 examples: sha2 uses the precompile.
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.8-sp1-6.2.0" }
