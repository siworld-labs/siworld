[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/crypto",
    "crates/poseidon2",
    "crates/state",
    "crates/circuits",
    "crates/consensus",
    "crates/storage",
    "crates/prover",
    "crates/node",
]
# STARK library selection benchmarks: a separate workspace, outside the consensus path.
exclude = ["crates/bench-stark"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
repository = "https://github.com/siworld-labs/siworld"

[workspace.dependencies]
async-trait = "0.1"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
rpassword = "7.4"
blake3 = "1"
chacha20poly1305 = { version = "0.11.0", default-features = false }
getrandom = "0.4"
zeroize = "1.9.1"
rustix = { version = "1.1.5", features = ["fs", "process"] }
# Plonky3, pinned to the version the STARK experiments use (docs/benchmarks.md).
p3-field = "=0.9.0-rc.2"
p3-koala-bear = "=0.9.0-rc.2"
p3-symmetric = "=0.9.0-rc.2"
p3-uni-stark = "=0.9.0-rc.2"
# Plonky3-recursion tracks only 0.9.0-rc.2 and has no release; the same commit
# as crates/bench-stark.
p3-circuit-prover = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "3a69ba61f713c8400b14eb3d8f0e52caa13512c7" }
p3-recursion = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "3a69ba61f713c8400b14eb3d8f0e52caa13512c7" }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rand = { version = "0.10.3", default-features = false, features = ["std_rng"] }
# The circuit and its aggregation live in the benchmark workspace until they
# are promoted (docs/security-model.md); the prover crate uses them in place.
siworld-bench-common = { path = "crates/bench-stark/common" }
siworld-bench-plonky3 = { path = "crates/bench-stark/plonky3" }
libcrux-ml-kem = { version = "0.0.11", default-features = false, features = ["mlkem768"] }
libcrux-ml-dsa = { version = "0.0.11", default-features = false, features = ["mldsa65"] }
futures = "0.3"
libp2p = { version = "0.56", default-features = false, features = ["tokio", "tcp", "dns", "noise", "yamux", "request-response", "macros"] }
primitive-types = { version = "0.14", default-features = false }
redb = "4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
siworld-core = { path = "crates/core" }
siworld-crypto = { path = "crates/crypto" }
siworld-poseidon2 = { path = "crates/poseidon2" }
siworld-state = { path = "crates/state" }
siworld-circuits = { path = "crates/circuits" }
siworld-consensus = { path = "crates/consensus" }
siworld-storage = { path = "crates/storage" }
siworld-prover = { path = "crates/prover" }
siworld-node = { path = "crates/node" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Consensus paths use integers only (CONTRIBUTING.md, consensus invariants).
float_arithmetic = "deny"

# Dependencies are optimized under every profile: ML-KEM trial-decrypts every
# output in wallet tests, ML-DSA signs development-fund payouts, and STARK
# proving (the Plonky3 stack and the circuits in crates/bench-stark, which the
# prover tests run end to end) is impractical unoptimized. Workspace crates
# keep the profile's own level.
[profile.dev.package."*"]
opt-level = 3
# Debug info for the proof stack alone runs to gigabytes.
debug = false
