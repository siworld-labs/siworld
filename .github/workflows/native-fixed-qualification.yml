name: Native minimum hardware qualification

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Authorized Linux runner with at least 4 vCPUs and 30 GiB visible RAM for the 32 GB miner profile
        type: string
        default: ubuntu-24.04
  pull_request:
    paths:
      # Reuse completed qualification for CLI, service, transport and local-policy changes.
      # Dispatch explicitly when a proof-affecting dependency change needs acceptance.
      - 'crates/native-node/src/proofs.rs'
      - 'crates/native-node/src/proof_codec.rs'
      - 'crates/native-node/src/state.rs'
      - 'crates/native-node/src/producer.rs'
      - 'crates/native-node/src/wire.rs'
      - 'crates/native-node/src/wallet_vault/native_roundtrip.rs'
      - 'crates/bench-multi-asset/**'
      - 'crates/bench-d8/**'
      - 'scripts/qualify-native-transaction.py'
      - 'scripts/qualify-native-settlement.py'
      - 'scripts/minimum-hardware.py'
      - 'scripts/qualification-cgroup.py'
      - 'scripts/prover-launcher.rs'
      - 'scripts/tests/test_minimum_hardware.py'
      - 'scripts/tests/test_cgroup_measurement.py'
      - 'scripts/tests/test_native_fixed_qualification.py'

permissions:
  contents: read

concurrency:
  group: native-fixed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-fixed:
    name: Minimum ${{ matrix.role }} resources and frozen native proofs
    runs-on: ${{ inputs.runner_label || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        role: [validator, miner]
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/native-fixed-target
      HARDWARE_PROFILE: minimum-${{ matrix.role }}
      RAYON_NUM_THREADS: 4
      SIWORLD_COMPOSITION_HIDING_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check collector contracts and frozen source identities
        run: |
          python3 -m unittest discover -s scripts/tests -p test_native_fixed_qualification.py -v
          python3 -m unittest discover -s scripts/tests -p test_native_cgroup_measurement.py -v
          python3 -m unittest discover -s scripts/tests -p test_minimum_hardware.py -v
          python3 -m unittest discover -s scripts/tests -p test_cgroup_measurement.py -v
          python3 scripts/check-native-proof-profiles.py --check crates/bench-multi-asset/artifacts/v1-native-proof-profiles.json
      - name: Qualify the actual CPU and cgroup boundary before heavy work
        run: |
          python3 scripts/minimum-hardware.py \
            --hardware-profile "$HARDWARE_PROFILE" \
            --output .local/native-fixed/public/preflight
          test -e /sys/fs/cgroup/cgroup.controllers
          sudo --non-interactive systemctl --version
          python3 scripts/qualification-cgroup.py --smoke-scope --timeout 10 \
            --output .local/native-fixed/public/scope-preflight
      - name: Install the repository toolchain
        run: rustup toolchain install
      - name: Check full x86-64-v3 CPU and AVX operating-system state before optimized code
        run: |
          rustc scripts/prover-launcher.rs --edition=2021 -O -D warnings -C target-cpu=x86-64 -o /tmp/native-fixed-cpu-check
          /tmp/native-fixed-cpu-check --check-cpu
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: |
            crates/bench-multi-asset -> ../../.local/native-fixed-target
            crates/native-node -> ../../.local/native-fixed-target
          cache-on-failure: true
      - name: Build and test the unchanged production relations and native runtime
        run: |
          python3 - <<'PY_CONFIG'
          import importlib.util
          import os
          spec = importlib.util.spec_from_file_location('controlled', 'scripts/build-composition-intra.py')
          controlled = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(controlled)
          controlled.controlled_configuration(os.environ)
          PY_CONFIG
          cargo fmt --manifest-path crates/bench-multi-asset/Cargo.toml --check
          cargo fmt --manifest-path crates/native-node/Cargo.toml --check
          cargo clippy --release --locked --manifest-path crates/native-node/Cargo.toml --all-targets -- -D warnings
          cargo test --release --locked --manifest-path crates/native-node/Cargo.toml
          cargo test --release --locked --manifest-path crates/bench-multi-asset/Cargo.toml --features security-report --lib
          cargo build --release --locked --manifest-path crates/bench-multi-asset/Cargo.toml --features security-report --bin native-scan
      - name: Actual native issuance block and durable recipient recovery
        run: cargo test --release --locked --manifest-path crates/native-node/Cargo.toml --lib wallet::tests::actual_native_issuance_block_recovers_registry_and_seed_wallet_after_restart -- --ignored --exact
      - name: Reproduce all frozen public verification keys and actual security reports
        run: |
          python3 scripts/check-native-proof-profiles.py --prepare .local/native-fixed/application
          cargo build --release --locked --manifest-path .local/native-fixed/application/Cargo.toml --features security-report --bin native-proof-artifacts
          mkdir -p .local/native-fixed/public/keys
          for kind in transaction settlement issuance; do
            "$CARGO_TARGET_DIR/release/native-proof-artifacts" "$kind" ".local/native-fixed/public/keys/$kind.json"
          done
          python3 scripts/check-native-proof-profiles.py --check crates/bench-multi-asset/artifacts/v1-native-proof-profiles.json --reproduced .local/native-fixed/public/keys
      - name: Inspect AVX2 instructions and package a generic CPU guard
        run: |
          python3 - <<'PY_PACKAGE'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          spec = importlib.util.spec_from_file_location('isa', 'scripts/check-prover-isa.py')
          isa = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(isa)
          worker = Path(os.environ['CARGO_TARGET_DIR']) / 'release/native-scan'
          inspected = isa.inspect(worker)
          target = Path('.local/native-fixed/package')
          (target / 'bin').mkdir(parents=True)
          (target / 'libexec').mkdir()
          shutil.copy2(worker, target / 'libexec/v1-transaction-scan')
          subprocess.run(['rustc', 'scripts/prover-launcher.rs', '--edition=2021', '-O',
              '-D', 'warnings', '-C', 'target-cpu=x86-64', '-o',
              str(target / 'bin/v1-transaction-scan')], check=True)
          Path('.local/native-fixed/public/isa.json').write_text(json.dumps({
              'diagnostic_binary': 'native-scan', 'required_isa': 'x86-64-v3',
              'binary_sha256': inspected['binary_sha256'],
              'avx2_packed_multiply_instructions': inspected['avx2_packed_multiply_instructions'],
              'cryptographic_approval': False, 'network_activation': False}, indent=2) + '\n')
          PY_PACKAGE
          .local/native-fixed/package/bin/v1-transaction-scan --check-cpu
      - name: Extract actual security reports without running the proof grid
        run: |
          mkdir -p .local/native-fixed/private
          .local/native-fixed/package/bin/v1-transaction-scan screen .local/native-fixed/private/screen.json
      - name: Run only frozen b7 q41 g20 transaction measurements
        run: |
          python3 scripts/qualify-native-transaction.py \
            --executable .local/native-fixed/package/bin/v1-transaction-scan \
            --worker .local/native-fixed/package/libexec/v1-transaction-scan \
            --screen .local/native-fixed/private/screen.json \
            --reproduced .local/native-fixed/public/keys \
            --hardware-profile "$HARDWARE_PROFILE" \
            --output .local/native-fixed/public/measurements
      - name: Measure three frozen fixed-576 settlement proofs with the 90-percent ceiling
        run: |
          python3 scripts/qualify-native-settlement.py \
            --executable .local/native-fixed/package/bin/v1-transaction-scan \
            --worker .local/native-fixed/package/libexec/v1-transaction-scan \
            --screen .local/native-fixed/private/screen.json \
            --reproduced .local/native-fixed/public/keys \
            --hardware-profile "$HARDWARE_PROFILE" \
            --output .local/native-fixed/public/settlement
      - name: Retain an explicit outcome on hardware, build or measurement failure
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY_STATUS'
          import json
          import os
          from pathlib import Path
          output = Path('.local/native-fixed/public')
          output.mkdir(parents=True, exist_ok=True)
          (output / 'workflow-status.json').write_text(json.dumps({
              'job_status_before_upload': os.environ['JOB_STATUS'],
              'source_commit': os.environ['SOURCE_COMMIT'],
              'requested_hardware_profile': os.environ['HARDWARE_PROFILE'],
              'minimum_configuration_requested': True,
              'minimum_role_memory_bytes': 32212254720 if os.environ['HARDWARE_PROFILE'] == 'minimum-miner' else 16106127360,
              'hardware_qualification_present': (output / 'preflight/hardware-qualification.json').is_file(),
              'measurement_summary_present': (output / 'measurements/summary.json').is_file(),
              'settlement_summary_present': (output / 'settlement/summary.json').is_file(),
              'proof_body_limit_bytes': 655360,
              'settlement_proof_body_limit_bytes': 655360,
              'settlement_measurement_ceiling_bytes': 589824,
              'four_worker_generation_limit_ns': 2000000000,
              'diagnostic_memory_max_bytes': 5368709120,
              'diagnostic_swap_max_bytes': 0,
              'memory_boundary_is_miner_requirement': False,
              'cryptographic_approval': False, 'network_activation': False,
              'acceptance': False}, indent=2) + '\n')
          PY_STATUS
      - name: Upload allowlisted public keys, CPU identity and kernel evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-fixed-minimum-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/native-fixed/public/**/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
