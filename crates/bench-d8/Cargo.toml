# Isolated D8/W24 recursive proof experiment.
# Standalone workspace, outside the production dependency graph.
[workspace]
resolver = "2"
members = ["."]


[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"
repository = "https://github.com/siworld-labs/siworld"

[workspace.dependencies]
# Plonky3: p3-recursion currently tracks only 0.9.0-rc.2, so everything is pinned to it.
p3-air = "=0.9.0-rc.2"
p3-field = "=0.9.0-rc.2"
p3-koala-bear = "=0.9.0-rc.2"
p3-matrix = "=0.9.0-rc.2"
p3-poseidon2 = "=0.9.0-rc.2"
p3-poseidon2-air = "=0.9.0-rc.2"
p3-symmetric = "=0.9.0-rc.2"
p3-uni-stark = "=0.9.0-rc.2"
p3-batch-stark = "=0.9.0-rc.2"
p3-challenger = "=0.9.0-rc.2"
p3-commit = "=0.9.0-rc.2"
p3-dft = "=0.9.0-rc.2"
p3-fri = "=0.9.0-rc.2"
p3-merkle-tree = "=0.9.0-rc.2"
p3-circuit-prover = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "3a69ba61f713c8400b14eb3d8f0e52caa13512c7" }
p3-recursion = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "3a69ba61f713c8400b14eb3d8f0e52caa13512c7" }
p3-circuit = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "3a69ba61f713c8400b14eb3d8f0e52caa13512c7" }
rand = { version = "0.10.3", default-features = false, features = ["std_rng", "sys_rng"] }
p3-maybe-rayon = "=0.9.0-rc.2"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }

[profile.release]
debug = false
lto = "thin"
codegen-units = 16

[package]
name = "siworld-d8-checkpoint-experiment"
description = "Isolated experimental D8 W24 recursive proof checkpoint"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
p3-air.workspace = true
p3-field.workspace = true
p3-koala-bear.workspace = true
p3-matrix.workspace = true
p3-poseidon2.workspace = true
p3-poseidon2-air.workspace = true
p3-symmetric.workspace = true
p3-uni-stark.workspace = true
p3-batch-stark.workspace = true
p3-circuit-prover.workspace = true
p3-recursion.workspace = true
p3-circuit.workspace = true
rand.workspace = true
p3-maybe-rayon.workspace = true
postcard.workspace = true
serde_json = "1.0.149"
p3-challenger.workspace = true
p3-commit.workspace = true
p3-dft.workspace = true
p3-fri.workspace = true
p3-merkle-tree.workspace = true
p3-security = { version = "=0.9.0-rc.2", optional = true }
p3-lookup = { version = "=0.9.0-rc.2", optional = true }

sha2 = "=0.10.9"
serde = "=1.0.228"

[features]
default = ["parallel"]
parallel = ["p3-maybe-rayon/parallel", "p3-recursion/parallel", "p3-circuit-prover/parallel"]
# Isolated higher-fan-in circuit evaluation; never enabled by the node.
experimental-fanin = []
# Fixed-label phase events for isolated process profiling.
phase-profile = []
# Offline instance-shape analysis; never enabled by the node.
security-report = ["dep:p3-security", "dep:p3-lookup"]



[[bin]]
name = "d8-checkpoint"
path = "src/bin/checkpoint.rs"
required-features = ["experimental-fanin", "phase-profile", "security-report"]
