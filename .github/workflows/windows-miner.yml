name: Windows native miner

on:
  pull_request:
    paths:
      - 'crates/**'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - 'scripts/build-windows-miner.py'
      - 'scripts/windows_miner_pe.py'
      - 'scripts/tests/test_windows_miner_package.py'
      - 'docs/windows-native-miner.md'
      - '.github/workflows/windows-miner.yml'
  push:
    branches: [main, 'feature/**', 'fix/**', 'release/**']
    paths:
      - 'crates/**'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - 'scripts/build-windows-miner.py'
      - 'scripts/windows_miner_pe.py'
      - 'scripts/tests/test_windows_miner_package.py'
      - 'docs/windows-native-miner.md'
      - '.github/workflows/windows-miner.yml'

permissions:
  contents: read

concurrency:
  group: windows-miner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/windows-tests-target
      RAYON_NUM_THREADS: '4'
      SIWORLD_COMPOSITION_HIDING_WORKERS: '2'
      SIWORLD_WINDOWS_RUNNER_LABEL: windows-latest
      AWS_LC_SYS_PREBUILT_NASM: '0'
      RUSTFLAGS: '-C target-cpu=x86-64-v3 -C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          $toolchain = python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('rust-toolchain.toml').read_text())['toolchain']['channel'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install $toolchain --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc -vV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Select MSVC x64 build environment
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC x64 tools are required' }
          & (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCINSTALLDIR')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          }
      - name: Install checksum-pinned NASM on CI only
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nasm-2.16.03-win64.zip'
          Invoke-WebRequest -Uri 'https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip' -OutFile $archive
          $expected = '3ee4782247bcb874378d02f7eab4e294a84d3d15f3f6ee2de2f47a46aa7226e6'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'NASM archive SHA-256 mismatch'
          }
          $tools = Join-Path $env:RUNNER_TEMP 'siworld-native-tools'
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          $nasmDirectory = Join-Path $tools 'nasm-2.16.03'
          $env:PATH = "$nasmDirectory;$env:PATH"
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          foreach ($tool in @('cl', 'link', 'ml64', 'cmake', 'nasm')) { Get-Command $tool -ErrorAction Stop | Select-Object Name, Source }
          cmake --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nasm -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check package provenance and PE audit regressions
        run: python -m unittest discover -s scripts/tests -p test_windows_miner_package.py -v
      - name: Admit CPU before optimized tests
        env:
          RUSTFLAGS: '-C target-cpu=x86-64 -C target-feature=+crt-static'
        run: cargo run --locked --manifest-path crates/miner-launcher/Cargo.toml -- --check-cpu
      - name: Check formatting
        run: |
          foreach ($crate in @('miner-platform', 'miner-cli', 'miner-launcher', 'native-node')) {
            cargo fmt --manifest-path "crates/$crate/Cargo.toml" --check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Native Windows storage and pure presentation tests
        run: |
          cargo test --locked --manifest-path crates/miner-platform/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release --locked --target x86_64-pc-windows-msvc --manifest-path crates/miner-cli/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:RUSTFLAGS = '-C target-cpu=x86-64 -C target-feature=+crt-static'
          cargo test --locked --manifest-path crates/miner-launcher/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Synthetic native transport, custody and reward regressions
        run: |
          foreach ($filter in @('service::network::tests', 'store::local_reward_tests', 'wallet_vault::tests', 'producer::tests::every_reward_is_seed_recoverable_with_unique_indexed_nullifiers')) {
            cargo test --release --locked --target x86_64-pc-windows-msvc --manifest-path crates/native-node/Cargo.toml --features native-p2p --lib $filter
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build unsigned native package and SHA-256
        run: python scripts/build-windows-miner.py --output .local/windows-miner-build
      - name: Verify runner hardware admission without mining
        run: |
          Expand-Archive -LiteralPath '.local/windows-miner-build/siworld-miner-windows-x86_64.zip' -DestinationPath '.local/windows-miner-extracted'
          $miner = '.local/windows-miner-extracted/siworld-miner-windows-x86_64/siworld-miner.exe'
          & $miner --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '.local/windows-miner-extracted/siworld-miner-windows-x86_64/libexec/siworld-miner-worker.exe' --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = & $miner --check-hardware 2>&1
          $code = $LASTEXITCODE
          $result | Write-Output
          if ($code -ne 0 -and ($code -ne 78 -or "$result" -notmatch 'Insufficient memory|CPU|AVX2')) {
            throw 'Hardware admission did not return a recognized result'
          }
          exit 0
      - name: Upload unsigned package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: siworld-miner-windows-x86_64
          path: |
            .local/windows-miner-build/siworld-miner-windows-x86_64.zip
            .local/windows-miner-build/SHA256SUMS
            .local/windows-miner-build/provenance.json
          if-no-files-found: error
          retention-days: 14
      - name: Record native archive sizes on failure
        if: ${{ failure() }}
        run: |
          Get-ChildItem -Path '.local/windows-tests-target' -Recurse -Filter '*p3_recursion*.rlib' -ErrorAction SilentlyContinue | Select-Object Name, Length
