name: Bug report
description: Something in the code does not behave as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here; use the repository's Security tab instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, inputs, or a failing test.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit
      description: The commit hash you tested.
