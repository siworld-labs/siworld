# Isolated native multi-asset proof evaluation.
# Standalone workspace, outside the production dependency graph.
[workspace]
resolver = "2"
members = ["."]


[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"
repository = "https://github.com/siworld-labs/siworld"

[workspace.dependencies]
# Plonky3: p3-recursion currently tracks only 0.9.0-rc.2, so everything is pinned to it.
p3-air = "=0.9.0-rc.2"
p3-field = "=0.9.0-rc.2"
p3-koala-bear = "=0.9.0-rc.2"
p3-matrix = "=0.9.0-rc.2"
p3-poseidon2 = "=0.9.0-rc.2"
p3-poseidon2-air = "=0.9.0-rc.2"
p3-symmetric = "=0.9.0-rc.2"
p3-uni-stark = "=0.9.0-rc.2"
p3-batch-stark = "=0.9.0-rc.2"
p3-challenger = "=0.9.0-rc.2"
p3-commit = "=0.9.0-rc.2"
p3-dft = "=0.9.0-rc.2"
p3-fri = "=0.9.0-rc.2"
p3-merkle-tree = "=0.9.0-rc.2"
p3-circuit-prover = { git = "https://github.com/siworld-labs/Plonky3-recursion", rev = "d3d15b2b5d1325fb38ebc8979c1cae04b761e71f" }
p3-recursion = { git = "https://github.com/siworld-labs/Plonky3-recursion", rev = "d3d15b2b5d1325fb38ebc8979c1cae04b761e71f" }
p3-circuit = { git = "https://github.com/siworld-labs/Plonky3-recursion", rev = "d3d15b2b5d1325fb38ebc8979c1cae04b761e71f" }
rand = { version = "0.10.3", default-features = false, features = ["std_rng", "sys_rng"] }
p3-maybe-rayon = "=0.9.0-rc.2"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }

[profile.release]
debug = false
lto = "thin"
codegen-units = 16

[package]
name = "siworld-multi-asset-experiment"
description = "Native D8 private multi-asset transaction and issuance evaluation"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
native_base = { package = "siworld-d8-checkpoint-experiment", path = "../bench-d8", default-features = false }
libcrux-ml-dsa = { version = "=0.0.11", default-features = false, features = ["mldsa65"] }
p3-air.workspace = true
p3-field.workspace = true
p3-koala-bear.workspace = true
p3-matrix.workspace = true
p3-poseidon2.workspace = true
p3-poseidon2-air.workspace = true
p3-symmetric.workspace = true
p3-uni-stark.workspace = true
p3-batch-stark.workspace = true
p3-circuit-prover.workspace = true
p3-recursion.workspace = true
p3-circuit.workspace = true
rand.workspace = true
p3-maybe-rayon.workspace = true
postcard.workspace = true
serde_json = { version = "1.0.149", features = ["float_roundtrip"] }
p3-challenger.workspace = true
p3-commit.workspace = true
p3-dft.workspace = true
p3-fri.workspace = true
p3-merkle-tree.workspace = true
p3-security = { version = "=0.9.0-rc.2", optional = true }
p3-lookup = { version = "=0.9.0-rc.2", optional = true }

sha2 = "=0.10.9"
serde = "=1.0.228"
blake3 = { version = "1.8.3", features = ["zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
zeroize = "=1.9.1"
getrandom = "0.4"
libcrux-ml-kem = { version = "=0.0.11", default-features = false, features = ["mlkem768"] }

[features]
default = ["parallel"]
parallel = ["native_base/parallel", "p3-maybe-rayon/parallel", "p3-recursion/parallel", "p3-circuit-prover/parallel"]
# Isolated higher-fan-in circuit evaluation; never enabled by the node.
experimental-fanin = []
# Fixed-label phase events for isolated process profiling.
phase-profile = []
# Offline instance-shape analysis; never enabled by the node.
security-report = ["native_base/security-report", "dep:p3-security", "dep:p3-lookup"]
