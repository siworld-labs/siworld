name: Linux proof resource control
on:
  push:
    branches: ["codex/d8-w24-security-and-latency"]
    paths:
      - ".cargo/config.toml"
      - "scripts/measure-proof-cgroup.py"
      - "scripts/validate-d4-cgroup.py"
      - "scripts/compare-d4-linux.py"
      - "scripts/build-composition-intra.py"
      - "scripts/build-prover-release.py"
      - "scripts/prover-launcher.rs"
      - "scripts/check-prover-isa.py"
      - "crates/bench-stark/plonky3/src/profile.rs"
      - "crates/bench-stark/plonky3/src/bin/composition_bench.rs"
      - ".github/workflows/d8-linux-controls.yml"
  workflow_dispatch:
    inputs:
      hardware_profile:
        description: Require an explicitly selected reference profile; hosted runners are not reserved hardware
        type: choice
        required: true
        default: diagnostic
        options:
          - diagnostic
          - epyc7763-baseline
          - epyc9v45-control
permissions:
  contents: read
concurrency:
  group: linux-proof-control-${{ github.ref }}
  cancel-in-progress: false
jobs:
  d4-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RAYON_NUM_THREADS: 2
      SIWORLD_COMPOSITION_HIDING_WORKERS: 2
      SIWORLD_BENCH_PROFILE: 1
      HARDWARE_PROFILE: ${{ inputs.hardware_profile || 'diagnostic' }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/d4-target-avx2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: crates/bench-stark
      - name: Qualify runner profile without assuming reserved hardware
        run: |
          python3 - <<'PY_PROFILE'
          import json, os, runpy
          measurement = runpy.run_path('scripts/measure-proof-cgroup.py')
          hardware, _ = measurement['qualify']()
          qualification = measurement['qualify_hardware_profile'](hardware, os.environ['HARDWARE_PROFILE'])
          print(json.dumps({'hardware': hardware, 'hardware_qualification': qualification}, indent=2))
          PY_PROFILE
      - name: Build fixed x86-64-v3 two-worker control
        shell: bash
        run: |
          mkdir -p .local/d4-build-evidence
          python3 scripts/build-composition-intra.py --verbose > .local/d4-build-evidence/avx2.log 2>&1
          cp .local/composition-intra/build-receipt.json .local/d4-build-evidence/avx2-receipt.json
          rustc -vV > .local/d4-build-evidence/compiler.txt
          rustc -C target-cpu=x86-64-v3 --print cfg > .local/d4-build-evidence/avx2-cfg.txt
      - name: Package CPU-check launcher and inspect optimized worker
        run: |
          python3 scripts/build-prover-release.py \
            --worker .local/d4-target-avx2/release/composition-bench \
            --worker-receipt .local/composition-intra/build-receipt.json \
            --output .local/d4-release
          python3 scripts/check-prover-isa.py --binary .local/d4-release/libexec/composition-bench
          .local/d4-release/bin/composition-bench --check-cpu
      - name: Three x86-64-v3 trials on the same live runner
        run: |
          python3 scripts/compare-d4-linux.py --avx2-only \
            --avx2 .local/d4-release/bin/composition-bench \
            --hardware-profile "$HARDWARE_PROFILE" \
            --output .local/linux-d4-comparison
