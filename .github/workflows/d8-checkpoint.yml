name: D8 frozen performance checkpoint
on:
  push:
    branches: ["research/d8-w24-security-and-latency"]
    paths:
      - "crates/bench-d8/**"
      - "crates/bench-stark/patches/recursion-d8-w24.patch"
      - "scripts/build-d8-checkpoint.py"
      - "scripts/measure-d8-checkpoint.py"
      - "scripts/measure-proof-cgroup.py"
      - "scripts/tests/test_cgroup_measurement.py"
      - "scripts/tests/test_d8_checkpoint.py"
      - "scripts/build-prover-release.py"
      - "scripts/prover-launcher.rs"
      - ".cargo/config.toml"
      - ".github/workflows/d8-checkpoint.yml"
  workflow_dispatch:
    inputs:
      run_checkpoint:
        description: After correctness tests and a controlled build, run three frozen warm N=16 trials
        type: boolean
        required: true
        default: true
permissions:
  contents: read
concurrency:
  group: d8-checkpoint-epyc7763-baseline
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RAYON_NUM_THREADS: 2
      SIWORLD_COMPOSITION_HIDING_WORKERS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/d8-target
      CHECKPOINT_REQUESTED: ${{ github.event_name == 'push' || inputs.run_checkpoint }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Qualify Linux correctness host with separate checkpoint admission
        run: |
          python3 - <<'PY_PROFILE'
          import json
          import os
          from pathlib import Path
          import runpy
          measurement = runpy.run_path('scripts/measure-proof-cgroup.py')
          checkpoint = os.environ['CHECKPOINT_REQUESTED'] == 'true'
          try:
              hardware, _ = measurement['qualify']()
              print(json.dumps({'hardware': hardware}, indent=2))
              profile = ('epyc7763-baseline' if checkpoint or 'EPYC 7763 ' in hardware['cpu_model']
                  else 'epyc9v45-control' if 'EPYC 9V45 ' in hardware['cpu_model'] else 'diagnostic')
              result = measurement['qualify_hardware_profile'](hardware, profile)
              mount = Path('/sys/fs/cgroup')
              measurement['qualify_cpu_profile'](measurement['cpu_ancestry'](mount, mount), profile)
          except ValueError:
              print(json.dumps({'event': 'd8_checkpoint_hardware_rejected',
                  'checkpoint_requested': checkpoint, 'measurements_started': False,
                  'required_profile': 'epyc7763-baseline' if checkpoint else 'supported-correctness-host'}))
              raise SystemExit(78)
          print(json.dumps({'correctness_hardware_qualification': result,
              'checkpoint_requires': 'epyc7763-baseline'}, indent=2))
          PY_PROFILE
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: crates/bench-d8 -> ../../.local/d8-target
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Validate checkpoint collector contracts
        run: |
          python3 -m unittest discover -s scripts/tests -p test_d8_checkpoint.py
          python3 -m unittest discover -s scripts/tests -p test_cgroup_measurement.py
      - name: Apply pinned patch, test D8 correctness, build and package v3 worker
        run: |
          python3 - <<'PY_BUILD'
          import json
          from pathlib import Path
          import subprocess
          import sys
          Path('.local').mkdir(exist_ok=True)
          log = Path('.local/d8-checkpoint-build.log')
          with log.open('x') as stream:
              result = subprocess.run([sys.executable, 'scripts/build-d8-checkpoint.py',
                  '--output', '.local/d8-checkpoint-build'], stdout=stream, stderr=stream)
          for line in log.read_text().splitlines():
              try:
                  record = json.loads(line)
              except ValueError:
                  continue
              if record.get('event') in ('d8_build_failure', 'd8_build_adapter_failure', 'd8_build_tests_passed'):
                  print(json.dumps(record))
          raise SystemExit(result.returncode)
          PY_BUILD
      - name: Three frozen trials in one resident 10-GiB experimental process tree
        if: ${{ env.CHECKPOINT_REQUESTED == 'true' }}
        run: |
          python3 - <<'PY_CHECKPOINT'
          import json
          from pathlib import Path
          import runpy
          import subprocess
          import sys

          receipt = json.loads(Path('.local/d8-checkpoint-build/bootstrap-receipt.json').read_text())
          output = Path('.local/d8-checkpoint-results').resolve()
          with Path('.local/d8-checkpoint-supervisor.log').open('x') as log:
              result = subprocess.run([sys.executable, 'scripts/measure-d8-checkpoint.py',
                  '--manifest', receipt['bootstrap_manifest'],
                  '--sha256', receipt['bootstrap_manifest_sha256'],
                  '--output', str(output)], stdout=log, stderr=log)
          report_file = output / 'checkpoint.json'
          if report_file.is_file():
              report = json.loads(report_file.read_text())
              helper = runpy.run_path('scripts/measure-d8-checkpoint.py')
              print(json.dumps(helper['public_summary'](report), indent=2))
          else:
              print(json.dumps({'complete': False, 'acceptance': False, 'decision': 'incomplete'}))
          # Raw process samples, artifacts, keys and owner evidence remain
          # private and are not uploaded or printed into public workflow logs.
          raise SystemExit(result.returncode)
          PY_CHECKPOINT
