[workspace]
resolver = "2"
members = ["."]

[package]
name = "siworld-fund-keytool"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"
repository = "https://github.com/siworld-labs/siworld"
description = "Offline ML-DSA-65 development-fund key custody"

[dependencies]
libcrux-ml-dsa = { version = "=0.0.11", default-features = false, features = ["mldsa65"] }
getrandom = "=0.4.3"
zeroize = "=1.9.1"
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
blake3 = { version = "=1.8.7", features = ["zeroize"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
rpassword = "=7.4.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 16
